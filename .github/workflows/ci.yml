name: Verify Autolab
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: pip install -r services/gateway/requirements.txt -r devices/raspberry-pi/requirements.txt
      - run: pytest tests -q -k "not e2e"
      - run: npx playwright install --with-deps chromium
      - run: python tests/run_e2e.py
